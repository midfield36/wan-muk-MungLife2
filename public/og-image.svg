<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <linearGradient id="pastelBg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFDF8"/>
      <stop offset="35%" stop-color="#FFF8E8"/>
      <stop offset="70%" stop-color="#FFF2EE"/>
      <stop offset="100%" stop-color="#F2F8FF"/>
    </linearGradient>
    <linearGradient id="coralGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF9683"/>
      <stop offset="100%" stop-color="#FF6F59"/>
    </linearGradient>
    <linearGradient id="mintGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C5F0E0"/>
      <stop offset="100%" stop-color="#A6E6CE"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="70" result="blur"/>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#8C6E64" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#pastelBg)"/>

  <!-- Warm ambient blurred pastel circles -->
  <circle cx="180" cy="140" r="220" fill="#FFF4C7" fill-opacity="0.7" filter="url(#softGlow)"/>
  <circle cx="950" cy="200" r="260" fill="#FFD5CB" fill-opacity="0.5" filter="url(#softGlow)"/>
  <circle cx="1100" cy="500" r="220" fill="#CDEBFF" fill-opacity="0.6" filter="url(#softGlow)"/>
  <circle cx="500" cy="520" r="200" fill="#BCEBD9" fill-opacity="0.5" filter="url(#softGlow)"/>

  <!-- Left Content Area -->
  <g transform="translate(100, 100)">
    <!-- Brand Tagline Badge -->
    <g transform="translate(0, 0)">
      <rect width="260" height="42" rx="21" fill="#FFF4C7" stroke="#FFB8A4" stroke-width="1.5"/>
      <text x="24" y="27" fill="#E65D47" font-family="'Pretendard', sans-serif" font-size="15" font-weight="800">
        🐾 전국 반려인을 위한 필수 앱
      </text>
    </g>

    <!-- Logo & Brand Name -->
    <g transform="translate(0, 68)">
      <rect width="60" height="60" rx="18" fill="#FFFFFF" stroke="#FFE0D6" stroke-width="2" filter="url(#cardShadow)"/>
      <circle cx="23" cy="22" r="5" fill="#FF806B"/>
      <circle cx="37" cy="22" r="5" fill="#FF806B"/>
      <circle cx="14" cy="32" r="4.5" fill="#FF806B"/>
      <circle cx="46" cy="32" r="4.5" fill="#FF806B"/>
      <path d="M30 30C22 30 18 35 18 42C18 46.5 22 49.5 30 49.5C38 49.5 42 46.5 42 42C42 35 38 30 30 30Z" fill="#FF806B"/>

      <text x="78" y="42" fill="#1E232B" font-family="'Pretendard', sans-serif" font-size="38" font-weight="900" letter-spacing="-0.5">
        멍라이프 <tspan fill="#FF806B" font-size="30" font-weight="800">MungLife</tspan>
      </text>
    </g>

    <!-- Main Headline -->
    <text x="0" y="200" fill="#1E232B" font-family="'Pretendard', sans-serif" font-size="52" font-weight="900" letter-spacing="-1.5">
      우리 강아지와 함께하는
    </text>
    <text x="0" y="265" fill="#FF6F59" font-family="'Pretendard', sans-serif" font-size="52" font-weight="900" letter-spacing="-1.5">
      모든 순간, 멍라이프!
    </text>

    <!-- Subtitle -->
    <text x="0" y="325" fill="#585E6A" font-family="'Pretendard', sans-serif" font-size="22" font-weight="500">
      소중한 반려견의 하루를 더 쉽고, 더 편리하고, 더 행복하게.
    </text>

    <!-- 3 Core Feature Tags -->
    <g transform="translate(0, 380)">
      <g transform="translate(0, 0)">
        <rect width="160" height="48" rx="14" fill="#FFF4C7" stroke="#FFE58F" stroke-width="1.2"/>
        <text x="80" y="30" text-anchor="middle" fill="#875800" font-family="'Pretendard', sans-serif" font-size="15" font-weight="700">📍 내 주변 장소</text>
      </g>
      <g transform="translate(175, 0)">
        <rect width="170" height="48" rx="14" fill="#FFDDD4" stroke="#FFB8A4" stroke-width="1.2"/>
        <text x="85" y="30" text-anchor="middle" fill="#B33A26" font-family="'Pretendard', sans-serif" font-size="15" font-weight="700">🚨 24시 응급병원</text>
      </g>
      <g transform="translate(360, 0)">
        <rect width="170" height="48" rx="14" fill="#D3F4E8" stroke="#BCEBD9" stroke-width="1.2"/>
        <text x="85" y="30" text-anchor="middle" fill="#176E50" font-family="'Pretendard', sans-serif" font-size="15" font-weight="700">📋 예방접종 수첩</text>
      </g>
    </g>
  </g>

  <!-- Right Visual: Smartphone Mockup with Pastel Styling -->
  <g transform="translate(830, 80)">
    <!-- Phone frame shadow -->
    <rect x="-12" y="12" width="280" height="485" rx="44" fill="#3D2924" fill-opacity="0.12" filter="url(#softGlow)"/>
    <!-- Phone outer body -->
    <rect width="280" height="480" rx="40" fill="#FFFFFF" stroke="#F0EAE1" stroke-width="6"/>
    <!-- Screen -->
    <rect x="8" y="8" width="264" height="464" rx="32" fill="#FFFDF8"/>
    <!-- Dynamic island -->
    <rect x="95" y="16" width="74" height="18" rx="9" fill="#1E232B"/>

    <!-- Inside Screen Mockup -->
    <!-- App Header -->
    <g transform="translate(24, 52)">
      <rect width="232" height="68" rx="16" fill="#FFF4C7" stroke="#FFEAA7" stroke-width="1"/>
      <circle cx="36" cy="34" r="20" fill="#FFFFFF"/>
      <text x="36" y="41" text-anchor="middle" font-size="22">🐶</text>
      <text x="68" y="28" fill="#1E232B" font-family="'Pretendard', sans-serif" font-size="13" font-weight="800">초코</text>
      <text x="96" y="28" fill="#FF806B" font-family="'Pretendard', sans-serif" font-size="11" font-weight="700">골든리트리버</text>
      <text x="68" y="48" fill="#717784" font-family="'Pretendard', sans-serif" font-size="10" font-weight="500">다음 광견병 예방접종 D-14</text>
    </g>

    <!-- Emergency bar -->
    <g transform="translate(24, 130)">
      <rect width="232" height="52" rx="14" fill="#FFECE6" stroke="#FFC9BA" stroke-width="1"/>
      <circle cx="28" cy="26" r="14" fill="#FF806B"/>
      <text x="28" y="32" text-anchor="middle" fill="#FFFFFF" font-size="12">🚨</text>
      <text x="50" y="24" fill="#B33A26" font-family="'Pretendard', sans-serif" font-size="11" font-weight="800">24시 응급 동물병원</text>
      <text x="50" y="39" fill="#8A4A3E" font-family="'Pretendard', sans-serif" font-size="9" font-weight="600">내 주변 즉시 진료 가능한 곳 3개</text>
    </g>

    <!-- Quick Buttons Grid -->
    <g transform="translate(24, 194)">
      <g transform="translate(0, 0)">
        <rect width="110" height="80" rx="14" fill="#EBF9F3" stroke="#BCEBD9" stroke-width="1"/>
        <text x="55" y="35" text-anchor="middle" font-size="20">📍</text>
        <text x="55" y="56" text-anchor="middle" fill="#176E50" font-family="'Pretendard', sans-serif" font-size="11" font-weight="800">동반 장소 찾기</text>
        <text x="55" y="69" text-anchor="middle" fill="#5A8A79" font-family="'Pretendard', sans-serif" font-size="9" font-weight="500">카페·식당·공원</text>
      </g>
      <g transform="translate(122, 0)">
        <rect width="110" height="80" rx="14" fill="#F3EEFF" stroke="#E5D9FF" stroke-width="1"/>
        <text x="55" y="35" text-anchor="middle" font-size="20">📋</text>
        <text x="55" y="56" text-anchor="middle" fill="#5F4299" font-family="'Pretendard', sans-serif" font-size="11" font-weight="800">반려견 수첩</text>
        <text x="55" y="69" text-anchor="middle" fill="#7E68AA" font-family="'Pretendard', sans-serif" font-size="9" font-weight="500">체중·접종 캘린더</text>
      </g>
    </g>

    <!-- Bottom Place Card -->
    <g transform="translate(24, 286)">
      <rect width="232" height="140" rx="16" fill="#F4F8FC" stroke="#CDEBFF" stroke-width="1"/>
      <rect x="12" y="12" width="208" height="68" rx="10" fill="#E1EEF9"/>
      <text x="116" y="50" text-anchor="middle" fill="#4B6B88" font-family="'Pretendard', sans-serif" font-size="11" font-weight="600">🗺️ 실시간 지도 탐색</text>
      <text x="16" y="102" fill="#1E232B" font-family="'Pretendard', sans-serif" font-size="12" font-weight="800">포포 펫카페 & 운동장</text>
      <text x="16" y="120" fill="#64748B" font-family="'Pretendard', sans-serif" font-size="10">마포구 연남동 · 천연잔디 · 420m</text>
    </g>
  </g>
</svg>
